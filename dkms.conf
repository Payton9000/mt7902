# DKMS packaging for the MT7902 backport (module: mt7902e)
#
#   sudo ./dkms/install-dkms.sh install --yes
#
# Why this exists: Ubuntu 22.04 is an LTS, but its HWE kernel track keeps getting
# point releases (6.8.0-139, -140, ...). A module that lives only under
# /lib/modules/<one-version> silently stops loading on the next upgrade. DKMS rebuilds
# it automatically via /etc/kernel/postinst.d/dkms.

PACKAGE_NAME="mt7902e"
PACKAGE_VERSION="1.0"

# Build against the kernel DKMS is currently installing for, not the running one.
MAKE[0]="make KVER=$kernelver"

BUILT_MODULE_NAME[0]="$PACKAGE_NAME"
BUILT_MODULE_LOCATION[0]="."

# NOTE: on Ubuntu this value is IGNORED. /usr/sbin/dkms's
# override_dest_module_location() hardcodes "/updates/dkms" for any kernel whose
# package name starts with "Ubuntu". Setting /extra or /kernel/... here has no
# effect. Kept as the conventional location for non-Ubuntu DKMS.
DEST_MODULE_LOCATION[0]="/updates/dkms"

AUTOINSTALL="yes"

# Firmware is deliberately NOT handled here. It has nothing to do with the kernel
# version, and Ubuntu's dkms only honours POST_INSTALL when it points at an
# executable script file (an inline shell snippet is silently skipped with
# "post_install script is not executable"). ./dkms/install-dkms.sh places the
# firmware itself and verifies it.
